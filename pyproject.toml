[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sculpt-perturbation"
version = "0.3.0"
description = "SCULPT: shared-action inversion for cross-context perturbation distribution prediction"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.26,<3", "scipy>=1.13,<2", "scikit-learn>=1.5,<2",
  "torch>=2.7,<2.8", "h5py>=3.11,<4", "pandas>=2.2,<3",
  "anndata>=0.10,<0.13", "pyarrow>=17,<24", "PyYAML>=6,<7",
  "safetensors>=0.4,<1", "requests>=2.32,<3", "huggingface-hub>=0.25,<2"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.8"]

[project.scripts]
sculpt = "cosit.cli:main"
cosit = "cosit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cosit = ["defaults.json"]
"cosit.core" = ["PORTABILITY.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
