name: sculpt
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
      - numpy==1.26.4
      - scipy==1.15.2
      - scikit-learn==1.5.2
      - h5py==3.13.0
      - pandas>=2.2,<3
      - anndata>=0.10,<0.13
      - pyarrow>=17,<24
      - PyYAML>=6,<7
      - safetensors>=0.4,<1
      - requests>=2.32,<3
      - huggingface-hub>=0.25,<2
      - pytest>=8,<10
# Install the correct PyTorch wheel separately, then pip install -e .
# GPU: pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cu128
# CPU: pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
